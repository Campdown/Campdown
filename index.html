<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campdown</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #12160d;
            color: white;
            /* Change the text color to white */
            padding: 20px;
            /* Reduced padding for mobile */
        }

        h1 {
            font-size: 2em;
            /* Reduced font size for mobile */
            margin-bottom: 15px;
            /* Reduced margin */
        }

        h2 {
            margin-top: 2em;
        }

        #countdowns {
            max-width: 1000px;
            margin-inline: auto;
        }

        .countdown {
            font-size: 1.8em;
            /* Slightly smaller font size */
            font-weight: bold;
            margin-top: 15px;
            /* Reduced margin */
            padding: 10px;
            border-radius: 5px;
            color: white;
            /* Already set to white */
        }

        .info-text {
            font-size: 1em;
            /* Adjusted font size for smaller screens */
            margin-top: 10px;
            /* Space above the info text */
            color: white;
            /* Ensure this text is also white */
        }

        .date-text {
            font-size: 1em;
            /* For styling the date text */
            margin-top: 10px;
            /* Space above the date text */
            color: white;
            /* Change the date text color to white */
        }

        /* Media queries for even smaller devices */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8em;
                /* Reduce further on very small screens */
            }

            .countdown,
            .info-text,
            .date-text {
                font-size: 1.5em;
                /* Make text larger for visibility */
            }
        }
    </style>
</head>

<body>

    <h1>Campdown</h1>

    <div id="countdowns"></div>

    <script>
        // Countdown target dates
        const dates = [
            {
                name: "Påskecamp",
                date: "April 12, 2025 11:00:00 GMT+0100",
                color: "#e14521"
            },
            {
                name: "Påskestevnet 1",
                date: "April 18, 2025 19:00:00 GMT+0100",
                color: "#004741"
            },
            {
                name: "Frivillighetshelg - Juni",
                date: "June 14, 2025 08:00:00 GMT+0100",
                color: "#d400ff"
            },
        ]

        // Function to start a countdown
        function startCountdown(targetDate, elementId, dateTextId) {
            const intervalId = setInterval(function () {
                const now = new Date().getTime();
                const distance = targetDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById(elementId).innerHTML = days + " dager " + hours + " timer " + minutes + " minutter " + seconds + " sekunder ";

                const targetDateObj = new Date(targetDate);
                document.getElementById(dateTextId).innerHTML = targetDateObj.toLocaleDateString('no-NO', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                if (distance < 0) {
                    clearInterval(intervalId);
                    document.getElementById(elementId).innerHTML = "Event is here!";
                    document.getElementById(dateTextId).innerHTML = "";
                }
            }, 1000);
        }

        function createCountdown(name, elementId, dateTextId, color) {
            const titleElement = document.createElement("h2");
            titleElement.innerText = name;

            const countdownElement = document.createElement("div");
            countdownElement.id = elementId;
            countdownElement.className = "countdown";
            countdownElement.innerText = "Laster..."
            countdownElement.style.backgroundColor = color;

            const textElement = document.createElement("p");
            textElement.id = dateTextId;
            textElement.className = "date-text";

            const container = document.getElementById("countdowns");
            container.appendChild(titleElement);
            container.appendChild(countdownElement);
            container.appendChild(textElement);
        }

        dates.forEach((date, index) => {
            const countDownDate = new Date(date.date).getTime();
            const elementId = "countdown" + index;
            const dateTextId = "date" + index;
            createCountdown(date.name, elementId, dateTextId, date.color);
            startCountdown(countDownDate, elementId, dateTextId);
        });
    </script>

    <!-- Telegram Bot Link -->
    <div class="info-text" style="margin-top: 30px;">
        Telegram Bot: <a href="http://telegram.me/Campdownbot" style="color: #ea791b; text-decoration: underline;">Click
            here</a>
    </div>

</body>

</html>
