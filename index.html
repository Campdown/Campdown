<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campdown</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #12160d;
      color: white;
      padding: 20px;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 15px;
    }
    .countdown-container {
      margin-bottom: 30px;
    }
    .countdown {
      font-size: 1.8em;
      font-weight: bold;
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      color: white;
      background-color: #333;
    }
    .date-text {
      font-size: 1em;
      margin-top: 10px;
      color: white;
    }
    .info-text {
      font-size: 1em;
      margin-top: 30px;
    }

    a {
      color: #ea791b;
      text-decoration: underline;
    }

    .more-button {
      display: inline-block;
      background-color: #ea791b;
      color: white;
      padding: 10px 18px;
      margin-top: 20px;
      border-radius: 6px;
      font-size: 1em;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .more-button:hover {
      background-color: #cc6610;
    }

    .more-links a {
      display: block;
      margin: 8px auto;
      padding: 10px;
      background-color: #222;
      color: white;
      width: fit-content;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    .more-links a:hover {
      background-color: #444;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8em;
      }
      .countdown, .info-text, .date-text {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>

<h1>Campdown</h1>
<div id="countdowns"></div>

<div class="info-text">
  <a class="more-button" href="#/more">Se alle nedtellinger</a>
</div>

<script>
  let countdownIntervals = [];

  async function loadCountdowns() {
    const res = await fetch('./dates.txt');
    const text = await res.text();

    const groups = text.trim().split(/\r?\n-\r?\n/).map(g => g.trim()).filter(Boolean);
    const allEntries = [];

    groups.forEach(group => {
      const lines = group.split('\n').map(l => l.trim()).filter(Boolean);
      for (let i = 0; i < lines.length; i += 3) {
        const name = lines[i];
        const date = new Date(lines[i + 1]);
        const color = lines[i + 2];
        if (!isNaN(date)) {
          allEntries.push({ name, date, color });
        }
      }
    });

    function clearCountdowns() {
      countdownIntervals.forEach(id => clearInterval(id));
      countdownIntervals = [];
    }

    function render() {
      clearCountdowns();
      const hash = decodeURIComponent(location.hash.slice(2)).toLowerCase();
      const container = document.getElementById('countdowns');
      container.innerHTML = '';

      if (hash === 'more') {
        const moreDiv = document.createElement('div');
        moreDiv.className = 'more-links';
        allEntries.forEach(entry => {
          const link = document.createElement('a');
          link.href = `#/${encodeURIComponent(entry.name.toLowerCase())}`;
          link.textContent = entry.name;
          moreDiv.appendChild(link);
        });
        container.appendChild(moreDiv);
      } else if (hash) {
        const match = allEntries.find(e => e.name.toLowerCase() === hash);
        if (match) {
          displayCountdown(match, 0);
        } else {
          container.innerHTML = '<p>Nedtelling ikke funnet.</p>';
        }
      } else {
        const now = new Date();
        const grouped = {};
        allEntries.forEach(entry => {
          if (!grouped[entry.color]) grouped[entry.color] = [];
          grouped[entry.color].push(entry);
        });

        let index = 0;
        Object.values(grouped).forEach(group => {
          const upcoming = group.filter(e => e.date > now).sort((a, b) => a.date - b.date);
          if (upcoming.length > 0) {
            displayCountdown(upcoming[0], index++);
          }
        });
      }
    }

    function displayCountdown(entry, index) {
      const container = document.getElementById('countdowns');
      const div = document.createElement('div');
      div.className = 'countdown-container';
      const countdownId = `countdown${index}`;
      const dateId = `date${index}`;

      div.innerHTML = `
        <h2>${entry.name}</h2>
        <div class="countdown" id="${countdownId}" style="background-color: ${entry.color};"></div>
        <p class="date-text" id="${dateId}"></p>
      `;
      container.appendChild(div);

      const intervalId = startCountdown(entry.date, countdownId, dateId);
      countdownIntervals.push(intervalId);
    }

    function startCountdown(targetDate, elementId, dateTextId) {
      const update = () => {
        const now = new Date().getTime();
        const distance = targetDate - now;
        const el = document.getElementById(elementId);
        const dateEl = document.getElementById(dateTextId);

        if (!el || !dateEl) return;

        if (distance <= 0) {
          el.innerText = "Event is here!";
          dateEl.innerText = "";
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        el.innerText = `${days} dager ${hours} timer ${minutes} minutter ${seconds} sekunder`;
        dateEl.innerText = targetDate.toLocaleString('no-NO');
      };

      update();
      return setInterval(update, 1000);
    }

    window.addEventListener('hashchange', render);
    render();
  }

  window.addEventListener("DOMContentLoaded", loadCountdowns);
</script>

</body>
</html>
